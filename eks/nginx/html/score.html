<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성적 등록 및 조회 - MSP Solution Architect</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #1a1a2e;
            color: white;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 26px;
            margin-bottom: 6px;
        }

        header p {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 15px;
        }

        .nav-link {
            display: inline-block;
            color: #3182ce;
            background: white;
            padding: 6px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .nav-link:hover {
            background: #e2e8f0;
        }

        .container {
            flex: 1;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
        }

        .form-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .score-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)) auto;
            gap: 15px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: bold;
            color: #4a5568;
        }

        .form-group select,
        .form-group input {
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-submit {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            height: 41px;
        }

        .btn-submit:hover {
            background-color: #2b6cb0;
        }

        hr {
            border: none;
            border-top: 2px solid #e2e8f0;
            margin: 30px 0;
        }

        .result-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .result-section h2 {
            font-size: 18px;
            color: #2d3748;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #e2e8f0;
            padding: 12px;
            text-align: center;
            font-size: 14px;
        }

        th:nth-child(3), td:nth-child(3) {
            text-align: left;
        }

        th {
            background-color: #f7fafc;
            color: #4a5568;
        }

        footer {
            background-color: #1a1a2e;
            color: #a0aec0;
            text-align: center;
            padding: 20px;
            font-size: 13px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>MSP Solution Architect Portal</h1>
        <p>교육생 성적 등록 및 관리</p>
        <a href="index.html" class="nav-link">&larr; 메인으로 돌아가기</a>
    </header>

    <div class="container">

        <div class="form-card">
            <div class="score-form">
                <div class="form-group">
                    <label for="studentSelect">학생명 선택</label>
                    <select id="studentSelect">
                        <option value="">불러오는 중...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="korInput">국어</label>
                    <input type="number" id="korInput" placeholder="점수" min="0" max="100">
                </div>
                <div class="form-group">
                    <label for="engInput">영어</label>
                    <input type="number" id="engInput" placeholder="점수" min="0" max="100">
                </div>
                <div class="form-group">
                    <label for="mathInput">수학</label>
                    <input type="number" id="mathInput" placeholder="점수" min="0" max="100">
                </div>
                <button class="btn-submit" onclick="registerScore()">등록</button>
            </div>
        </div>

        <hr>

        <div class="result-section">
            <h2>모든 학생들의 등록된 성적 리스트</h2>
            <div id="scoreResult">
                <table>
                    <thead>
                        <tr>
                            <th>NO</th>
                            <th>과정</th>
                            <th>학생명</th>
                            <th>국어</th>
                            <th>영어</th>
                            <th>수학</th>
                            <th>평균</th>
                        </tr>
                    </thead>
                    <tbody id="scoreTableBody">
                        <tr><td colspan="7">불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 MegazoneCloud MSP Solution Architect Course. All rights reserved.</p>
    </footer>

    <script>
    async function loadStudents() {
        const select = document.getElementById('studentSelect');
        try {
            const response = await fetch('/test/api/students');
            const students = await response.json();

            select.innerHTML = '';
            students.forEach((s) => {
                const option = document.createElement('option');
                option.value = s.student_idx;
                option.textContent = `${s.name} (${s.class_name})`;
                select.appendChild(option);
            });
        } catch (e) {
            select.innerHTML = '<option value="">학생 목록을 불러올 수 없습니다</option>';
            console.error(e);
        }
    }

    async function loadScores() {
        const tbody = document.getElementById('scoreTableBody');
        try {
            const response = await fetch('/test/api/scores');
            const scores = await response.json();

            tbody.innerHTML = '';
            scores.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.class_name}</td>
                    <td>${item.name}</td>
                    <td>${item.kor}</td>
                    <td>${item.eng}</td>
                    <td>${item.mat}</td>
                    <td>${Number(item.avg).toFixed(1)}</td>
                `;
                tbody.appendChild(row);
            });
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="7">성적 목록을 불러올 수 없습니다</td></tr>';
            console.error(e);
        }
    }

    async function registerScore() {
        const studentIdx = document.getElementById('studentSelect').value;
        const kor = document.getElementById('korInput').value;
        const eng = document.getElementById('engInput').value;
        const math = document.getElementById('mathInput').value;

        if (!studentIdx) {
            alert('학생을 선택해주세요.');
            return;
        }
        if (!kor || !eng || !math) {
            alert('모든 과목의 점수를 입력해주세요.');
            return;
        }

        try {
            const response = await fetch('/test/api/scores', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    student_idx: Number(studentIdx),
                    kor: Number(kor),
                    eng: Number(eng),
                    mat: Number(math),
                }),
            });

            if (!response.ok) {
                throw new Error('등록 실패');
            }

            alert('성적이 등록되었습니다.');
            document.getElementById('korInput').value = '';
            document.getElementById('engInput').value = '';
            document.getElementById('mathInput').value = '';

            loadScores();
        } catch (e) {
            alert('성적 등록 중 오류가 발생했습니다.');
            console.error(e);
        }
      }

      loadStudents();
      loadScores();
    </script>
</body>
</html>
